name: Build & Deploy SKIL Master

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Signed AAB & APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'android-app/package-lock.json'

      - name: Install Android Dependencies & Sync Capacitor
        run: |
          cd android-app
          npm install
          npx cap sync android

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17
          cache: 'gradle'

      - name: Configure Dynamic Versioning
        run: |
          # Calculate strictly increasing version code based on GitHub Run Number
          BUILD_CODE=$((GITHUB_RUN_NUMBER + 10))
          BUILD_NAME="1.0.${GITHUB_RUN_NUMBER}"
          echo "VERSION_CODE=${BUILD_CODE}" > android-app/android/version.properties
          echo "VERSION_NAME=${BUILD_NAME}" >> android-app/android/version.properties
          echo "Dynamic Build Version Code: ${BUILD_CODE}"
          echo "Dynamic Build Version Name: ${BUILD_NAME}"

      - name: Prepare Release Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # If a GitHub Secret exists for KEYSTORE_BASE64, decode it; otherwise use the repo keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android-app/android/skil-release-key.jks
            echo "Keystore restored from GitHub Secrets."
          else
            echo "Using committed release keystore."
          fi

      - name: Build Signed Android App Bundle (AAB) & Universal APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || 'SkilMaster@2026' }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'skilmaster' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || 'SkilMaster@2026' }}
        run: |
          cd android-app/android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Prepare Release Artifacts
        run: |
          BUILD_NAME="1.0.${GITHUB_RUN_NUMBER}"
          mkdir -p artifacts
          cp android-app/android/app/build/outputs/bundle/release/app-release.aab "artifacts/SKIL_Master-v${BUILD_NAME}-signed.aab"
          cp android-app/android/app/build/outputs/apk/release/app-release.apk "artifacts/SKIL_Master-v${BUILD_NAME}-signed.apk"
          echo "Artifacts prepared in artifacts/:"
          ls -la artifacts/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "SKIL Master v1.0.${{ github.run_number }} (Release Build ${{ github.run_number }})"
          body: |
            ### 📦 SKIL Master — Automated CI/CD Release
            - **Application**: SKIL Master
            - **Package Identifier**: `com.skillifestyle.master`
            - **Version Name**: `1.0.${{ github.run_number }}`
            - **Version Code**: `${{ github.run_number }}`
            - **Target SDK**: Android 15 (API 35) • Latest Compliance Standard
            - **Digital Signing**: Production Key Verified (SHA-256 / RSA-2048)
            
            #### 📥 Download Assets:
            - **Google Play Store Bundle**: `SKIL_Master-v1.0.${{ github.run_number }}-signed.aab`
            - **Direct Phone Install (APK)**: `SKIL_Master-v1.0.${{ github.run_number }}-signed.apk`
          files: |
            artifacts/*.aab
            artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Google Play Console (Internal Testing)
        if: env.PLAY_CONFIGURED == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.skillifestyle.master
          releaseFiles: artifacts/*.aab
          track: internal
          status: completed
        env:
          PLAY_CONFIGURED: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' }}
