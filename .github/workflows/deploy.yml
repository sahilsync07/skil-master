name: Build & Deploy SKIL Master

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: 'Deploy / Rollout to Google Play Production track'
        required: false
        default: false
        type: boolean
      force_full_build:
        description: 'Force Full Android Release Build'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  detect-and-build:
    name: Build Signed AAB & APK
    runs-on: ubuntu-latest
    env:
      PLAY_CONFIGURED: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Changes (Data-Only vs App Revamp)
        id: check_changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "IS_FULL_BUILD=true" >> "$GITHUB_ENV"
            echo ">> Workflow manually dispatched: Triggering full Android Release build"
            if [ "${{ github.event.inputs.deploy_production }}" = "true" ]; then
              echo ">> MANUAL PRODUCTION DEPLOYMENT REQUESTED"
            fi
          else
            # Inspect changed files in the push
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD || true)
            echo "Changed files in commit:"
            echo "$CHANGED_FILES"
            
            # Check if web code, android native code, or workflow itself was modified
            if echo "$CHANGED_FILES" | grep -qE '^(web/(index\.html|app\.js|style\.css|tracking-ui\.js|manifest\.json)|android-app/|\.github/workflows/)'; then
              echo "IS_FULL_BUILD=true" >> "$GITHUB_ENV"
              echo ">> Code/UI files changed: Triggering full Android Release build"
            else
              echo "IS_FULL_BUILD=false" >> "$GITHUB_ENV"
              echo ">> Data-only changes: Skipping Android binary build (data reflects live via web/data & Supabase)"
            fi
          fi

      - name: Setup Node.js
        if: env.IS_FULL_BUILD == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'android-app/package-lock.json'

      - name: Sync Web Assets to Android & Capacitor
        if: env.IS_FULL_BUILD == 'true'
        run: |
          node sync-engine/deploy-root-pages.js
          cd android-app
          npm install
          npx cap sync android

      - name: Setup Java Development Kit (JDK 21)
        if: env.IS_FULL_BUILD == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
          cache: 'gradle'

      - name: Configure Dynamic Versioning
        if: env.IS_FULL_BUILD == 'true'
        run: |
          BUILD_CODE=$((GITHUB_RUN_NUMBER + 10))
          BUILD_NAME="1.0.${GITHUB_RUN_NUMBER}"
          echo "VERSION_CODE=${BUILD_CODE}" > android-app/android/version.properties
          echo "VERSION_NAME=${BUILD_NAME}" >> android-app/android/version.properties
          echo "BUILD_CODE=${BUILD_CODE}" >> "$GITHUB_ENV"
          echo "BUILD_NAME=${BUILD_NAME}" >> "$GITHUB_ENV"
          echo "Dynamic Build Version Code: ${BUILD_CODE}"
          echo "Dynamic Build Version Name: ${BUILD_NAME}"

      - name: Prepare Release Signing Keystore
        if: env.IS_FULL_BUILD == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android-app/android/skil-release-key.jks
            echo "Keystore restored from GitHub Secrets."
          else
            echo "Using committed release keystore."
          fi

      - name: Build Signed Android App Bundle (AAB) & Universal APK
        if: env.IS_FULL_BUILD == 'true'
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || 'SkilMaster@2026' }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'skilmaster' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || 'SkilMaster@2026' }}
        run: |
          cd android-app/android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Prepare Release Artifacts
        if: env.IS_FULL_BUILD == 'true'
        run: |
          BUILD_NAME="1.0.${GITHUB_RUN_NUMBER}"
          mkdir -p artifacts
          cp android-app/android/app/build/outputs/bundle/release/app-release.aab "artifacts/SKIL_Master-v${BUILD_NAME}-signed.aab"
          cp android-app/android/app/build/outputs/apk/release/app-release.apk "artifacts/SKIL_Master-v${BUILD_NAME}-signed.apk"
          echo "Artifacts prepared in artifacts/:"
          ls -la artifacts/

      - name: Publish GitHub Release
        if: env.IS_FULL_BUILD == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.BUILD_NAME }}
          name: "SKIL Master v${{ env.BUILD_NAME }} (Build ${{ env.BUILD_CODE }})"
          body: |
            ### 📦 SKIL Master — Automated CI/CD Release
            - **Application**: SKIL Master
            - **Package Identifier**: `com.skillifestyle.master`
            - **Version Name**: `${{ env.BUILD_NAME }}`
            - **Version Code**: `${{ env.BUILD_CODE }}`
            - **Target SDK**: Android 16 (API 36) • Latest Compliance Standard
            - **Digital Signing**: Production Key Verified (SHA-256 / RSA-2048)
            
            #### 📥 Download Assets:
            - **Google Play Store Bundle**: `SKIL_Master-v${{ env.BUILD_NAME }}-signed.aab`
            - **Direct Phone Install (APK)**: `SKIL_Master-v${{ env.BUILD_NAME }}-signed.apk`
          files: |
            artifacts/*.aab
            artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # TRACK 1: Internal Testing (Automatic on push & dispatch)
      - name: Deploy to Google Play (Internal Testing)
        if: env.IS_FULL_BUILD == 'true' && env.PLAY_CONFIGURED == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.skillifestyle.master
          releaseFiles: artifacts/SKIL_Master-v${{ env.BUILD_NAME }}-signed.aab
          track: internal
          status: completed

      # TRACK 2: Closed Testing (Alpha - Automatic on push & dispatch)
      - name: Deploy to Google Play (Closed Testing - Alpha)
        if: env.IS_FULL_BUILD == 'true' && env.PLAY_CONFIGURED == 'true'
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.skillifestyle.master
          releaseFiles: artifacts/SKIL_Master-v${{ env.BUILD_NAME }}-signed.aab
          track: alpha
          status: completed

      # TRACK 3: Open Testing (Beta - Automatic on push & dispatch)
      - name: Deploy to Google Play (Open Testing - Beta)
        if: env.IS_FULL_BUILD == 'true' && env.PLAY_CONFIGURED == 'true'
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.skillifestyle.master
          releaseFiles: artifacts/SKIL_Master-v${{ env.BUILD_NAME }}-signed.aab
          track: beta
          status: completed

      # TRACK 4: Production (Manual Trigger Only via workflow_dispatch)
      - name: Deploy to Google Play (Production) - Manual Trigger
        if: env.IS_FULL_BUILD == 'true' && env.PLAY_CONFIGURED == 'true' && github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_production == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.skillifestyle.master
          releaseFiles: artifacts/SKIL_Master-v${{ env.BUILD_NAME }}-signed.aab
          track: production
          status: completed

      - name: Log Data-Only Sync Confirmation
        if: env.IS_FULL_BUILD == 'false'
        run: |
          echo "✅ Data-only update confirmed."
          echo "All ledger data, vouchers, and statement JSONs are synced live to web/data."
          echo "No Android app store binary release required for data updates."
